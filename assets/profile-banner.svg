<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Yossof Salah — Digital Signature</title>
  <desc id="desc">Dark navy profile banner with a cyan signature mark and subtle circuit pattern.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0a1c31"/>
      <stop offset="1" stop-color="#112348"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#26d6d7" stop-opacity=".24"/>
      <stop offset="1" stop-color="#26d6d7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52f2df"/>
      <stop offset="1" stop-color="#54a9ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8ca4c7" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1200" height="340" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="26" fill="url(#grid)"/>
  <circle cx="970" cy="155" r="230" fill="url(#glow)"/>
  <circle cx="990" cy="120" r="116" fill="#1fbcc9" opacity=".11" filter="url(#soft)"/>
  <path d="M782 44H1138M742 296H1146" stroke="#5bdcdb" stroke-opacity=".14"/>
  <path d="M835 72h95l24 24h86M780 242h112l32-32h150M900 281h130l27-27h88" fill="none" stroke="#6eece4" stroke-opacity=".22" stroke-width="2"/>
  <g fill="#76eae3" opacity=".65"><circle cx="835" cy="72" r="4"/><circle cx="1040" cy="96" r="4"/><circle cx="780" cy="242" r="4"/><circle cx="1074" cy="210" r="4"/><circle cx="900" cy="281" r="4"/></g>
  <rect x="64" y="56" width="74" height="74" rx="17" fill="#0c2838" stroke="url(#accent)" stroke-width="2"/>
  <path d="M83 78l18 19 18-19M101 97v17M120 82h10M120 91h10M120 100h10" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
