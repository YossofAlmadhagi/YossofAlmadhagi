  <text x="62" y="213" fill="#f2f7ff" font-size="68" font-weight="800" letter-spacing="4" font-family="Segoe UI, Arial, sans-serif">YOSSOF SALAH</text>
  <rect x="64" y="233" width="64" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="147" y="240" fill="#b8d0e7" font-size="18" font-weight="600" letter-spacing="3" font-family="Segoe UI, Arial, sans-serif">CYBERSECURITY STUDENT</text>
  <text x="65" y="292" fill="#87a9c7" font-size="14" letter-spacing="3" font-family="Segoe UI, Arial, sans-serif">LEARN  /  BUILD  /  SECURE</text>
