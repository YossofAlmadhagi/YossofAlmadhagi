<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Yossof Al-Madhagi</title>
  <desc id="desc">Dark blue personal banner with a cyan YM monogram, editorial typography, and a subtle orbit motif.</desc>
  <defs>
