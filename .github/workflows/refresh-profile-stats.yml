name: Refresh public profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
  push:
    branches: [main]
    paths:
      - scripts/update_stats.py
      - .github/workflows/refresh-profile-stats.yml

permissions:
  contents: read

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Refresh public activity card
        run: python3 scripts/update_stats.py
      - name: Save updated statistics
        run: |
          if git diff --quiet -- assets/github-stats.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg
          git commit -m 'Refresh public GitHub statistics'
          git push
